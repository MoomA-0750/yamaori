# 押したとき・プルリクエストのたびに、画面を作り、型を確かめ、試験を回す
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Windows でだけ通る道（秘密の暗号化・タイムゾーンの名前・ファイルの置き換え）も試す
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # 試験で何十も起こすので、設定のファイルの見張りを切る
      DOTNET_hostBuilder__reloadConfigOnChange: "false"
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: 画面
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build
      - name: 試験
        run: dotnet test --configuration Release
